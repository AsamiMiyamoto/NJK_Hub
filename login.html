<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next Journey Keynote ログイン</title>
  <style>
    :root {
      /* 配色は戦略AP（NJK_APGAS）に合わせる */
      --primary-color: #6842c2;
      --primary-hover: #4a2f84;
      --primary-disabled: #bdaee2;
      --accent-color: #8b6ce3;
      --header-color: #6b4fbb;
      --on-primary: #ffffff;
      --bg-color: #f7f6fb;
      --card-bg: #ffffff;
      --text-color: #26364a;
      --text-muted: #6b7280;
      --text-disabled: #9aa4ae;
      --border-color: #dfe5eb;
      --input-border: #cfd7df;
      --active-tab-bg: #f2effb;
      --soft-bg: #f2effb;
      --readonly-bg: #f7f8fa;
      --link-color: #513a97;
      --secondary-color: #6b7280;
      --danger-color: #b42318;
      --danger-bg: #fff0ee;
      --success-color: #2f6f57;
      --success-bg: #f3f6f4;
      --warn-color: #a45d20;
      --warn-bg: #fff5e9;
      --warn-border: #e7d99b;
      --info-color: #235b9a;
      --info-bg: #edf5ff;
      --chip-color: #6842c2;
      --chip-bg: #eee8fb;
      --table-head-bg: #fbfcfd;
      --table-head-color: #687483;
      --table-border: #edf0f3;
      --table-stripe-bg: #fafbfc;
      --shadow-color: #00000014;
      --overlay-color: #0006;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 1px 3px var(--shadow-color);
      padding: 32px;
      margin: 60px auto 20px auto;
    }

    h2 {
      font-size: 20px;
      margin: 0 0 4px 0;
      color: var(--header-color);
      text-align: center;
    }

    .sub-title {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
    }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--input-border);
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .btn-primary {
      width: 100%;
      background-color: var(--primary-color);
      color: var(--on-primary);
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-primary:disabled { background-color: var(--primary-disabled); cursor: not-allowed; }

    .btn-dest {
      display: block;
      width: 100%;
      text-align: left;
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--input-border);
      padding: 12px 14px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .btn-dest:hover { background-color: var(--soft-bg); border-color: var(--primary-color); }
    .btn-dest:disabled { color: var(--text-disabled); cursor: not-allowed; background-color: var(--readonly-bg); }

    .error-message {
      color: var(--danger-color);
      font-size: 13px;
      margin-top: -8px;
      margin-bottom: 12px;
      display: none;
    }

    .welcome-info {
      text-align: center;
      margin-bottom: 20px;
    }

    .welcome-info .name {
      font-size: 17px;
      font-weight: bold;
    }

    .welcome-info .org {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .logout-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
    }

    .notice {
      background-color: var(--warn-bg);
      border: 1px solid var(--warn-border);
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .forgot-note {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .form-group input[readonly] { background-color: var(--readonly-bg); }

    #menu-error { margin-top: 0; }
    .notice a { color: var(--link-color); font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Next Journey Keynote</h2>
    <div class="sub-title">共通ログイン</div>

    <!-- ログインフォーム -->
    <div id="login-view">
      <div class="error-message" id="login-error"></div>
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>メールアドレス</label>
          <input type="email" id="login-email" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>パスワード</label>
          <input type="password" id="login-password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary" id="login-submit-btn">ログイン</button>
        <div class="forgot-note">パスワードがわからない場合は、管理者にリセットを依頼してください</div>
      </form>
      <span class="logout-link" onclick="showChangeView(false)">パスワードを変更する</span>
    </div>

    <!-- パスワード変更フォーム（強制変更・任意変更 共通） -->
    <div id="change-view" style="display:none;">
      <div class="notice" id="change-notice">パスワードの変更が必要です。新しいパスワードを設定してください。</div>
      <div class="error-message" id="change-error"></div>
      <form id="change-form" onsubmit="handleChangePassword(event)">
        <div class="form-group">
          <label>メールアドレス</label>
          <input type="email" id="change-email" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>現在のパスワード</label>
          <input type="password" id="change-current" required autocomplete="current-password">
        </div>
        <div class="form-group">
          <label>新しいパスワード</label>
          <input type="password" id="change-new" required autocomplete="new-password">
          <div class="hint">8文字以上。社員IDや現在のパスワードと同じものは使用できません。</div>
        </div>
        <div class="form-group">
          <label>新しいパスワード（確認）</label>
          <input type="password" id="change-confirm" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary" id="change-submit-btn">変更してログイン</button>
      </form>
      <span class="logout-link" onclick="backToLogin()">ログイン画面に戻る</span>
    </div>

    <!-- ログイン後：遷移先選択 -->
    <div id="menu-view" style="display:none;">
      <div class="welcome-info">
        <div class="name" id="menu-name"></div>
        <div class="org" id="menu-org"></div>
      </div>
      <div class="error-message" id="menu-error"></div>
      <div class="notice" id="menu-fallback">
        画面が切り替わらない場合は、こちらから開いてください。
        <a id="menu-fallback-link" href="#" target="_top">開く</a>
      </div>
      <button type="button" class="btn-dest" id="portal-btn" onclick="goToSystem('jinji', this)" disabled>ポータル（準備中）</button>
      <button type="button" class="btn-dest" onclick="goToSystem('strategy', this)">AP・タスク管理</button>
      <span class="logout-link" onclick="backToLogin()">ログアウト</span>
    </div>
  </div>

<script>
  const SYSTEM_URLS = {
    strategy: 'https://script.google.com/macros/s/AKfycbwC2en3g6XedkK4rQcwFPv5WTe4NVxK1yNnY3S0cQODdwPqcE9INiXI_rSCxrU86s6R/exec',
    jinji: 'https://script.google.com/macros/s/AKfycbyqGY8dPwXWB3vVOmaN2Eu9ZHWRqzwlK4VlZ01aVlURj4N1uPCnV7Iin14hPCd9SMnG/exec'
  };

  // ログインセッションID（共通基盤側で6時間有効）。ページを再読み込みすると破棄され、再ログインが必要
  let sessionId = null;

  // 遷移先への移動がブラウザにブロックされた場合に、手動で開くリンクを出すまでの待ち時間
  const NAV_FALLBACK_DELAY_MS = 3000;
  let navFallbackTimer = null;

  function showView(viewId) {
    ['login-view', 'change-view', 'menu-view'].forEach(id => {
      document.getElementById(id).style.display = (id === viewId) ? 'block' : 'none';
    });
  }

  function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const errorBox = document.getElementById('login-error');
    errorBox.style.display = 'none';

    const btn = document.getElementById('login-submit-btn');
    btn.disabled = true;
    btn.textContent = 'ログイン中...';

    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        btn.textContent = 'ログイン';
        if (res.mustChangePassword) {
          showChangeView(true);
          return;
        }
        completeLogin(res);
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.textContent = 'ログイン';
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      })
      .verifyLogin(email, password);
  }

  /**
   * パスワード変更フォームを表示する
   * forced=true：ログイン時の強制変更（メールアドレス・現在のPWはログイン入力値を引き継ぐ）
   */
  function showChangeView(forced) {
    document.getElementById('change-form').reset();
    document.getElementById('change-error').style.display = 'none';
    document.getElementById('change-notice').style.display = forced ? 'block' : 'none';

    const emailInput = document.getElementById('change-email');
    emailInput.value = document.getElementById('login-email').value;
    emailInput.readOnly = forced;
    if (forced) {
      document.getElementById('change-current').value = document.getElementById('login-password').value;
    }
    document.getElementById('login-password').value = '';
    showView('change-view');
  }

  function handleChangePassword(e) {
    e.preventDefault();
    const email = document.getElementById('change-email').value;
    const currentPw = document.getElementById('change-current').value;
    const newPw = document.getElementById('change-new').value;
    const confirmPw = document.getElementById('change-confirm').value;
    const errorBox = document.getElementById('change-error');
    errorBox.style.display = 'none';

    if (newPw !== confirmPw) {
      errorBox.textContent = '新しいパスワード（確認）が一致しません。';
      errorBox.style.display = 'block';
      return;
    }

    const btn = document.getElementById('change-submit-btn');
    btn.disabled = true;
    btn.textContent = '変更中...';

    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        btn.textContent = '変更してログイン';
        document.getElementById('change-form').reset();
        completeLogin(res);
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.textContent = '変更してログイン';
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      })
      .changePassword(email, currentPw, newPw);
  }

  /**
   * ログイン完了処理（通常ログイン・パスワード変更後の共通）
   */
  function completeLogin(res) {
    sessionId = res.sessionId;
    document.getElementById('login-password').value = '';
    document.getElementById('menu-name').textContent = res.name + ' さん';
    document.getElementById('menu-org').textContent =
      [res.departmentName, res.sectionName].filter(v => v && v !== '-' && v !== '(部署なし)').join(' / ') || '所属なし';
    // ポータルを押せるか・準備中表示にするかはサーバー側で判定した結果に従う
    const portalBtn = document.getElementById('portal-btn');
    portalBtn.disabled = !res.portalEnabled;
    portalBtn.textContent = res.portalPreparing ? 'ポータル（準備中）' : 'ポータル';
    resetMenuMessages();
    showView('menu-view');
  }

  function showMenuError(message) {
    const errorBox = document.getElementById('menu-error');
    errorBox.textContent = message;
    errorBox.style.display = 'block';
  }

  /**
   * 手動で開くリンクを表示する（トークン付きURL・target="_top"）
   */
  function showNavFallback(url) {
    document.getElementById('menu-fallback-link').href = url;
    document.getElementById('menu-fallback').style.display = 'block';
  }

  function resetMenuMessages() {
    clearTimeout(navFallbackTimer);
    navFallbackTimer = null;
    document.getElementById('menu-error').style.display = 'none';
    document.getElementById('menu-fallback').style.display = 'none';
    document.getElementById('menu-fallback-link').href = '#';
  }

  /**
   * 遷移先システムへSSOトークン付きで移動する。
   * トークン発行を待ってから移動するため、ブラウザが画面の移動をブロックすることがある。
   * その場合は一定時間たっても画面が移らないので、手動で開くリンクを出す（クリック操作なら移動できる）。
   */
  function goToSystem(key, btn) {
    resetMenuMessages();
    if (!sessionId) {
      showMenuError('ログイン状態を確認できません。ログアウトして、再度ログインしてください。');
      return;
    }
    const targetUrl = SYSTEM_URLS[key];
    if (!targetUrl) {
      showMenuError('遷移先が設定されていません。管理者にお問い合わせください。');
      return;
    }
    btn.disabled = true;

    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        if (!res || !res.token) {
          // 利用できない遷移先と判定された場合は、ボタンも押せない状態に戻す
          if (res && res.error) btn.disabled = true;
          showMenuError((res && res.error) || '遷移用のトークンを発行できませんでした。');
          return;
        }
        const url = targetUrl + '?sso_token=' + encodeURIComponent(res.token);
        navFallbackTimer = setTimeout(() => showNavFallback(url), NAV_FALLBACK_DELAY_MS);
        try {
          window.top.location.href = url;
        } catch (e) {
          // ブロック時に例外となるブラウザもあるため、その場合はすぐにリンクを出す
          clearTimeout(navFallbackTimer);
          showNavFallback(url);
        }
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        // セッション切れ・アカウント状態の変更はいずれも再ログインが必要
        alert(err.message);
        backToLogin();
      })
      .issueSsoTokenForSession(sessionId, key);
  }

  function backToLogin() {
    resetMenuMessages();
    if (sessionId) {
      google.script.run.logoutSession(sessionId);
      sessionId = null;
    }
    document.getElementById('login-password').value = '';
    document.getElementById('change-form').reset();
    document.getElementById('login-error').style.display = 'none';
    showView('login-view');
  }
</script>

</body>
</html>
